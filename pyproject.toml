[project]
name = "wifilab"
version = "0.2.0"
description = "WiFiLab: Wi-Fi scanner, survey heatmaps and reports for macOS (CoreWLAN), with a web UI"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Igor Batin"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-docx==1.1.2",
    "pillow==11.3.0",
    "rumps==0.4.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreWLAN==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-CoreLocation==12.2.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "httpx==0.28.1"]
build = []

[project.scripts]
wifilab = "wifilab.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wifilab = ["static/*", "static/js/*", "static/css/*", "data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP038"]
